<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Command Center | Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #07090e;
      --card-bg: rgba(18, 22, 31, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --input-bg: rgba(10, 13, 20, 0.6);
      --accent-blue: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --accent-green: #10b981;
      --accent-green-glow: rgba(16, 185, 129, 0.25);
      --accent-red: #f43f5e;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Glows */
    .ambient-glow-1 {
      position: fixed;
      top: -15%;
      left: -10%;
      width: 45vw;
      height: 45vw;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.1) 0%, rgba(0, 0, 0, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    .ambient-glow-2 {
      position: fixed;
      bottom: -15%;
      right: -10%;
      width: 45vw;
      height: 45vw;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.07) 0%, rgba(0, 0, 0, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Header */
    header {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 32px;
      background: rgba(10, 13, 20, 0.8);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .brand-subtitle {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .system-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent-green);
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      background-color: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 12px var(--accent-green); }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    .btn-logout {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      color: var(--text-secondary);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-logout:hover {
      background: rgba(244, 63, 94, 0.1);
      border-color: rgba(244, 63, 94, 0.3);
      color: var(--accent-red);
    }

    /* Main Container (Centered & Simplified) */
    main {
      position: relative;
      z-index: 10;
      flex: 1;
      max-width: 800px;
      width: 100%;
      margin: 40px auto;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .dashboard-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
    }

    /* Core Presence Hero Section */
    .presence-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
    }

    .card-title {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .presence-indicator-ring {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(16, 185, 129, 0.1);
      border: 2px solid rgba(16, 185, 129, 0.3);
      box-shadow: 0 0 40px var(--accent-green-glow);
      margin-bottom: 24px;
      transition: all 0.3s ease;
    }

    .presence-indicator-ring.clear {
      background: rgba(100, 116, 139, 0.1);
      border-color: rgba(100, 116, 139, 0.2);
      box-shadow: none;
    }

    .presence-indicator-ring svg {
      width: 50px;
      height: 50px;
      fill: var(--accent-green);
    }

    .presence-indicator-ring.clear svg {
      fill: var(--text-muted);
    }

    .presence-info h2 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .presence-info p {
      font-size: 0.95rem;
      color: var(--text-secondary);
      margin-bottom: 32px;
    }

    /* Single Simple Metric Box */
    .metric-badge {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      padding: 12px 24px;
      border-radius: 14px;
      font-size: 0.9rem;
    }

    .metric-badge span {
      color: var(--text-muted);
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
    }

    .metric-badge strong {
      color: var(--text-primary);
      font-weight: 600;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <div class="ambient-glow-1"></div>
  <div class="ambient-glow-2"></div>

  <!-- Header -->
  <header>
    <div class="nav-brand">
      <div class="brand-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      </div>
      <div>
        <div class="brand-title">Security Command</div>
        <div class="brand-subtitle">HLK-LD2410B Sensor Hub</div>
      </div>
    </div>
    <div class="nav-actions">
      <div class="system-status-pill">
        <span class="pulse-dot"></span> System Online
      </div>
      <a href="/admin-login.html" class="btn-logout">Sign Out</a>
    </div>
  </header>

  <!-- Simplified Content Area -->
  <main>
    <div class="dashboard-card presence-hero">
      <span class="card-title">Live Presence Status</span>

      <div class="presence-indicator-ring" id="ringIndicator">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2m0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8m1-13h-2v6h6v-2h-4z"/></svg>
      </div>

      <div class="presence-info">
        <h2 id="presenceStatusText">Presence Detected</h2>
        <p id="presenceSubText">Active target within sensor range</p>
      </div>

      <div class="metric-badge">
        <span>Target Distance:</span>
        <strong id="targetDistance">1.8 Meters</strong>
      </div>
    </div>
  </main>

  <script>
    // Clean minimal update function for sensor state
    function updateSensorState(data) {
      const ring = document.getElementById('ringIndicator');
      const statusText = document.getElementById('presenceStatusText');
      const subText = document.getElementById('presenceSubText');
      const distance = document.getElementById('targetDistance');

      if (data.presence) {
        ring.classList.remove('clear');
        statusText.innerText = 'Presence Detected';
        subText.innerText = 'Active target within sensor range';
      } else {
        ring.classList.add('clear');
        statusText.innerText = 'Zone Clear';
        subText.innerText = 'No target movement detected';
      }

      if (data.distance) {
        distance.innerText = data.distance + ' Meters';
      }
    }
  </script>

</body>
</html>
