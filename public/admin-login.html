<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Command Center | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #07090e;
      --card-bg: rgba(18, 22, 31, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --input-bg: rgba(10, 13, 20, 0.6);
      --input-border: rgba(255, 255, 255, 0.12);
      --accent-blue: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --accent-green: #10b981;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    /* Ambient Glow Backgrounds */
    .ambient-glow-1 {
      position: absolute;
      top: -10%;
      left: -10%;
      width: 50vw;
      height: 50vw;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.12) 0%, rgba(0, 0, 0, 0) 70%);
      pointer-events: none;
    }

    .ambient-glow-2 {
      position: absolute;
      bottom: -10%;
      right: -10%;
      width: 50vw;
      height: 50vw;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.08) 0%, rgba(0, 0, 0, 0) 70%);
      pointer-events: none;
    }

    .auth-card {
      position: relative;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      z-index: 10;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.2);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent-blue);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 20px;
    }

    .brand-badge .pulse-dot {
      width: 6px;
      height: 6px;
      background-color: var(--accent-blue);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-blue);
    }

    .auth-header h1 {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .auth-header p {
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin-bottom: 28px;
    }

    .social-btn {
      width: 100%;
      padding: 12px 16px;
      background-color: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      color: var(--text-primary);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.2s ease;
      margin-bottom: 12px;
    }

    .social-btn:hover {
      background-color: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 24px 0;
      color: var(--text-muted);
      font-size: 0.75rem;
      letter-spacing: 0.05em;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--card-border);
    }

    .divider span {
      padding: 0 12px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 8px;
      color: var(--text-secondary);
    }

    input {
      width: 100%;
      padding: 12px 16px;
      background-color: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      color: #ffffff;
      font-size: 0.95rem;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 4px var(--accent-glow);
      background-color: rgba(10, 13, 20, 0.9);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3);
      transition: all 0.2s ease;
    }

    .btn-submit:hover {
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.45);
      transform: translateY(-1px);
    }

    .toggle-auth {
      text-align: center;
      margin-top: 24px;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .toggle-auth a {
      color: var(--accent-blue);
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      margin-left: 4px;
    }

    .toggle-auth a:hover {
      text-decoration: underline;
    }

    #error-msg {
      color: #f87171;
      font-size: 0.85rem;
      text-align: center;
      margin-top: 14px;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="ambient-glow-1"></div>
  <div class="ambient-glow-2"></div>

  <div class="auth-card">
    <div class="brand-badge">
      <span class="pulse-dot"></span> Security Network
    </div>

    <div class="auth-header">
      <h1 id="portal-title">Welcome Back</h1>
      <p id="portal-subtitle">Access ESP12E live presence portal</p>
    </div>

    <!-- OAuth Button -->
    <button class="social-btn" onclick="window.location.href='/auth/google'">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
      Continue with Google
    </button>

    <div class="divider"><span>OR AUTHORIZE WITH CREDENTIALS</span></div>

    <!-- Credentials Form -->
    <form id="authForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-submit" id="submit-btn">Sign In</button>
      <div id="error-msg"></div>
    </form>

    <div class="toggle-auth">
      <span id="toggle-text">Don't have access?</span>
      <a onclick="toggleAuthMode()" id="toggle-link">Create account</a>
    </div>
  </div>

  <script>
    let isRegisterMode = false;

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      const title = document.getElementById('portal-title');
      const subtitle = document.getElementById('portal-subtitle');
      const submitBtn = document.getElementById('submit-btn');
      const toggleText = document.getElementById('toggle-text');
      const toggleLink = document.getElementById('toggle-link');
      const errorDiv = document.getElementById('error-msg');

      errorDiv.innerText = '';

      if (isRegisterMode) {
        title.innerText = 'Create Account';
        subtitle.innerText = 'Register credentials for dashboard access';
        submitBtn.innerText = 'Register System Access';
        toggleText.innerText = 'Already authorized?';
        toggleLink.innerText = 'Sign in';
      } else {
        title.innerText = 'Welcome Back';
        subtitle.innerText = 'Access ESP12E live presence portal';
        submitBtn.innerText = 'Sign In';
        toggleText.innerText = "Don't have access?";
        toggleLink.innerText = 'Create account';
      }
    }

    document.getElementById('authForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const errorDiv = document.getElementById('error-msg');
      errorDiv.innerText = '';

      const username = e.target.username.value;
      const password = e.target.password.value;
      const endpoint = isRegisterMode ? '/register' : '/login';

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          window.location.href = data.redirect || '/Dashboard.html';
        } else {
          errorDiv.innerText = data.message || 'Authentication failed';
        }
      } catch (err) {
        errorDiv.innerText = 'Connection error. Please try again.';
      }
    });
  </script>

</body>
</html>
