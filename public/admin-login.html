<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Back - ESP12E Live Presence Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 50%, #151d2a 0%, #0b0f17 100%);
      color: #e6edf3;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: #111622;
      border: 1px solid #1f293d;
      border-radius: 16px;
      padding: 36px 32px;
      width: 100%;
      max-width: 410px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: rgba(0, 168, 225, 0.1);
      border: 1px solid rgba(0, 168, 225, 0.25);
      color: #00a8e1;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      background-color: #00a8e1;
      border-radius: 50%;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13px;
      color: #8b949e;
      margin-bottom: 24px;
    }

    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 10px 16px;
      background-color: #161c2a;
      color: #ffffff;
      border: 1px solid #28334a;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .google-btn:hover {
      background-color: #1e2638;
      border-color: #3b4b6b;
    }

    .google-icon {
      width: 18px;
      height: 18px;
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: #48546a;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.8px;
      margin: 24px 0;
      text-transform: uppercase;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #1f293d;
    }

    .divider span {
      padding: 0 10px;
    }

    .form-group {
      margin-bottom: 18px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #8b949e;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      background-color: #0b0f17;
      border: 1px solid #1f293d;
      border-radius: 8px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: #00a8e1;
    }

    input::placeholder {
      color: #3b465a;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(180deg, #00a8e1 0%, #0082b3 100%);
      border: none;
      border-radius: 8px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 168, 225, 0.3);
      transition: opacity 0.2s ease;
      margin-top: 8px;
    }

    .submit-btn:hover {
      opacity: 0.9;
    }

    .footer-text {
      font-size: 12px;
      color: #8b949e;
      text-align: center;
      margin-top: 20px;
    }

    .footer-text a {
      color: #00a8e1;
      text-decoration: none;
      font-weight: 500;
    }

    .footer-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">
      <span class="badge-dot"></span>
      Security Network
    </div>

    <h1>Welcome Back</h1>
    <p class="subtitle">Access ESP12E live presence portal</p>

    <a href="/api/auth/google" class="google-btn">
      <svg class="google-icon" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      Continue with Google
    </a>

    <div class="divider">
      <span>Or authorize with credentials</span>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter username" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="submit-btn">Sign In</button>
    </form>

    <div class="footer-text">
      Don't have access? <a href="#" id="createAccountBtn">Create account</a>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = e.target.username.value;
      const password = e.target.password.value;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = '/Dashboard.html';
        } else {
          alert(data.message || 'Login failed');
        }
      } catch (err) {
        alert('An error occurred during sign in.');
      }
    });

    document.getElementById('createAccountBtn').addEventListener('click', (e) => {
      e.preventDefault();
      alert('Account creation is restricted. Please sign in using your authorized Google Account.');
    });
  </script>

</body>
</html>
