<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Database - Portal</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --accent-color: #238636;
      --accent-hover: #2ea043;
      --text-main: #c9d1d9;
      --text-muted: #8b949e;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .auth-container {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 32px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .auth-header h1 {
      font-size: 1.4rem;
      margin: 0 0 8px 0;
      color: #ffffff;
    }

    .auth-header p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin: 0;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    input {
      width: 100%;
      padding: 10px 12px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #ffffff;
      font-size: 0.9rem;
      box-sizing: border-box;
    }

    input:focus {
      outline: none;
      border-color: #58a6ff;
    }

    .btn-primary {
      width: 100%;
      padding: 10px;
      background-color: var(--accent-color);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 20px 0;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border-color);
    }

    .divider span {
      padding: 0 10px;
    }

    .social-btn {
      width: 100%;
      padding: 10px;
      background-color: transparent;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .social-btn:hover {
      background-color: rgba(255, 255, 255, 0.05);
    }

    .toggle-auth {
      text-align: center;
      margin-top: 20px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .toggle-auth a {
      color: #58a6ff;
      text-decoration: none;
      cursor: pointer;
    }

    .toggle-auth a:hover {
      text-decoration: underline;
    }

    #error-msg {
      color: #f85149;
      font-size: 0.85rem;
      text-align: center;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-header">
      <h1 id="portal-title">Admin Login</h1>
      <p id="portal-subtitle">Access ESP12E Sensor Monitoring</p>
    </div>

    <!-- OAuth Options -->
    <button class="social-btn" onclick="window.location.href='/auth/google'">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
      Continue with Google
    </button>
    <button class="social-btn" onclick="handleOAuth('GitHub')">
      <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
      Continue with GitHub
    </button>

    <div class="divider"><span>OR</span></div>

    <!-- Credentials Form -->
    <form id="authForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary" id="submit-btn">Log In</button>
      <div id="error-msg"></div>
    </form>

    <div class="toggle-auth">
      <span id="toggle-text">Need an account?</span>
      <a onclick="toggleAuthMode()" id="toggle-link">Create one</a>
    </div>
  </div>

  <script>
    let isRegisterMode = false;

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      const title = document.getElementById('portal-title');
      const submitBtn = document.getElementById('submit-btn');
      const toggleText = document.getElementById('toggle-text');
      const toggleLink = document.getElementById('toggle-link');
      const errorDiv = document.getElementById('error-msg');

      errorDiv.innerText = '';

      if (isRegisterMode) {
        title.innerText = 'Create Account';
        submitBtn.innerText = 'Sign Up';
        toggleText.innerText = 'Already have an account?';
        toggleLink.innerText = 'Log in';
      } else {
        title.innerText = 'Admin Login';
        submitBtn.innerText = 'Log In';
        toggleText.innerText = 'Need an account?';
        toggleLink.innerText = 'Create one';
      }
    }

    function handleOAuth(provider) {
      alert(`${provider} authentication requires setting up OAuth Client Keys in server.js.`);
    }

    document.getElementById('authForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const errorDiv = document.getElementById('error-msg');
      errorDiv.innerText = '';

      const username = e.target.username.value;
      const password = e.target.password.value;
      const endpoint = isRegisterMode ? '/register' : '/login';

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          window.location.href = data.redirect || '/Dashboard.html';
        } else {
          errorDiv.innerText = data.message || 'Authentication failed';
        }
      } catch (err) {
        errorDiv.innerText = 'Server error. Please try again.';
      }
    });
  </script>

</body>
</html>
